name: CI

on:
  push:
    branches:
      - main
      - morpho6
  pull_request:
    branches:
      - main
      - morpho6

jobs:
  unix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Checkout Morpho 0.6.4
        uses: actions/checkout@v7
        with:
          repository: Morpho-lang/morpho
          ref: v0.6.4
          path: morpho-src

      # Same numeric stack as Morpho / morpho-cli / morpho-zeromq CI.
      - name: Install Morpho dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libsuitesparse-dev liblapacke-dev libunistring-dev

      - name: Install Morpho dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install suite-sparse

      # System compiler into /usr/local, like the other Morpho packages.
      # Do this before micromamba so CMake is not the conda toolchain.
      - name: Build and install Morpho
        working-directory: morpho-src
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          sudo cmake --install build --config Release
          sudo mkdir -p /usr/local/lib/morpho
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo ldconfig
          fi

      - name: Install micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment-dev.yml
          environment-name: xeus-morpho

      - name: Build and install xeus-morpho
        shell: bash -l {0}
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cc=/usr/bin/gcc
            cxx=/usr/bin/g++
          else
            cc=/usr/bin/clang
            cxx=/usr/bin/clang++
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$cc" \
            -DCMAKE_CXX_COMPILER="$cxx" \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$CONDA_PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build build -j
          cmake --install build

      - name: Test kernel
        shell: bash -l {0}
        working-directory: test
        run: pytest . -vv

  labextension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment-dev.yml
          environment-name: xeus-morpho
          create-args: >-
            nodejs
            jupyterlab>=4,<5

      - name: Test jupyterlab-morpho parser
        shell: bash -l {0}
        working-directory: jupyterlab-morpho
        run: |
          jlpm install
          jlpm test
