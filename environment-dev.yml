# Build/test deps. CI creates an env named xeus-morpho; locally install into
# the Jupyter env you already use:
#   conda env update -n "$CONDA_DEFAULT_ENV" -f environment-dev.yml
name: xeus-morpho
channels:
  - conda-forge
dependencies:
  # Build dependencies
  - cmake
  - cxx-compiler
  # Host dependencies
  - xeus >=6.0,<7
  - xeus-zmq >=4.0,<5
  - nlohmann_json
  - cppzmq
  # Test dependencies
  - pytest
  - jupyter_kernel_test>=0.4.3
